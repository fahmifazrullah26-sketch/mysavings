<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lupa Password — MySavings</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="../public/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="flex items-center justify-center min-h-screen px-4">
  <div class="glass-card w-full max-w-md p-8 fade-in">
    <h1 class="text-2xl font-bold mb-2 text-center">Lupa Password</h1>
    <p class="text-sm text-center mb-6" style="color:var(--text-muted)">
      Masukkan email terdaftar, kami akan kirimkan instruksi reset.
    </p>
    <form id="forgotForm" class="space-y-4">
      <input type="email" id="email" class="input-field" placeholder="Email" required />
      <button type="submit" class="btn-primary w-full">Kirim Instruksi</button>
    </form>
    <p class="text-center text-sm mt-6"><a href="login.html" class="text-green-600 font-semibold">Kembali ke login</a></p>
  </div>

  <script src="../public/js/config.js"></script>
  <script src="../public/js/api.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      try {
        const res = await apiRequest('/auth/forgot-password', { method: 'POST', body: { email } });
        Swal.fire({ icon: 'success', title: 'Terkirim', text: res.message, confirmButtonColor: '#22C55E' });
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Gagal', text: err.message, confirmButtonColor: '#22C55E' });
      }
    });
  </script>
</body>
</html>
