<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kalender Menabung — MySavings</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="../public/css/style.css" />
</head>
<body>
  <div class="flex min-h-screen">
    <aside id="sidebar" class="hidden md:flex md:flex-col w-64 glass-card m-4 mr-0"></aside>
    <div class="flex-1 flex flex-col">
      <header id="topbar" class="glass-card m-4 mb-0"></header>
      <main class="p-4 md:p-6 flex-1">
        <div class="flex items-center justify-between mb-4">
          <h1 class="text-xl font-bold">Kalender Menabung</h1>
          <div class="flex items-center gap-2">
            <button id="prevMonth" class="w-9 h-9 rounded-full glass-card"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="monthLabel" class="font-semibold w-36 text-center"></span>
            <button id="nextMonth" class="w-9 h-9 rounded-full glass-card"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>
        <div class="glass-card p-4">
          <div class="grid grid-cols-7 gap-2 mb-2 text-xs text-center" style="color:var(--text-muted)">
            <span>Min</span><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span>
          </div>
          <div id="calendarGrid" class="grid grid-cols-7 gap-2"></div>
          <div class="flex gap-4 mt-4 text-xs">
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:var(--primary)"></span> Menabung</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-red-300"></span> Tidak menabung</span>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../public/js/config.js"></script>
  <script src="../public/js/api.js"></script>
  <script src="../public/js/layout.js"></script>
  <script>
    renderLayout('calendar');
    let cursor = new Date();

    async function loadCalendar() {
      const year = cursor.getFullYear();
      const month = cursor.getMonth() + 1;
      document.getElementById('monthLabel').textContent = cursor.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });

      const res = await apiRequest(`/targets/calendar?year=${year}&month=${month}`);
      const savedDates = new Set(res.data.map(d => new Date(d).getDate()));

      const daysInMonth = new Date(year, month, 0).getDate();
      const firstDay = new Date(year, month - 1, 1).getDay();
      const today = new Date();
      const isCurrentMonth = today.getFullYear() === year && today.getMonth() + 1 === month;

      const grid = document.getElementById('calendarGrid');
      let html = '';
      for (let i = 0; i < firstDay; i++) html += `<div></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        let cls = 'future';
        if (savedDates.has(d)) cls = 'saved';
        else if (isCurrentMonth && d < today.getDate()) cls = 'missed';
        else if (!isCurrentMonth && cursor < today) cls = 'missed';
        html += `<div class="calendar-day ${cls}">${d}</div>`;
      }
      grid.innerHTML = html;
    }

    document.getElementById('prevMonth').onclick = () => { cursor.setMonth(cursor.getMonth() - 1); loadCalendar(); };
    document.getElementById('nextMonth').onclick = () => { cursor.setMonth(cursor.getMonth() + 1); loadCalendar(); };

    loadCalendar();
  </script>
</body>
</html>
