<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Achievement — MySavings</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="../public/css/style.css" />
</head>
<body>
  <div class="flex min-h-screen">
    <aside id="sidebar" class="hidden md:flex md:flex-col w-64 glass-card m-4 mr-0"></aside>
    <div class="flex-1 flex flex-col">
      <header id="topbar" class="glass-card m-4 mb-0"></header>
      <main class="p-4 md:p-6 flex-1">
        <h1 class="text-xl font-bold mb-4">Achievement</h1>
        <div id="badgeGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
      </main>
    </div>
  </div>

  <script src="../public/js/config.js"></script>
  <script src="../public/js/api.js"></script>
  <script src="../public/js/layout.js"></script>
  <script>
    renderLayout('achievements');
    async function loadAchievements() {
      const res = await apiRequest('/notifications/achievements');
      document.getElementById('badgeGrid').innerHTML = res.data.map(b => `
        <div class="glass-card p-4 text-center fade-in ${b.unlocked ? '' : 'opacity-40'}">
          <i class="fa-solid ${b.icon || 'fa-medal'} text-3xl mb-2" style="color:${b.unlocked ? '#22C55E' : '#94A3B8'}"></i>
          <p class="font-semibold text-sm">${b.title}</p>
          <p class="text-xs mt-1" style="color:var(--text-muted)">${b.description}</p>
          ${b.unlocked ? `<p class="text-xs mt-2 text-green-600">Diraih ${new Date(b.achieved_at).toLocaleDateString('id-ID')}</p>` : `<p class="text-xs mt-2" style="color:var(--text-muted)">Belum diraih</p>`}
        </div>
      `).join('');
    }
    loadAchievements();
  </script>
</body>
</html>
